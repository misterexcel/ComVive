name: CI

# Corre en cada pull request y en cada cambio a main.
# - docs: lint de Markdown.
# - secrets: detección de secretos con Gitleaks.
# - check: formato, lint, tipos, pruebas y compilación del monorepo (pnpm + Turborepo, ADR 0001).
#   Es la verificación obligatoria para fusionar a main (D34): no cambiar su nombre sin
#   actualizar la protección de la rama.
# - money-gold: solo en push a main. Pruebas de oro de dinero de @comvive/shared sin caché de
#   Turbo (--force), para que un resultado reutilizado no dé un falso verde (regla 2, ADR 0001).
# Node se toma de .nvmrc y pnpm del campo packageManager de package.json.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  docs:
    name: Lint de Markdown
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
      - run: npx --yes markdownlint-cli2@0.17.2

  secrets:
    name: Detección de secretos
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Gitleaks
        run: >
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.21.2
          detect --source /repo --redact --verbose --no-banner

  check:
    name: Verificación de código
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run format:check
      - run: pnpm run check

  money-gold:
    name: Pruebas de oro de dinero
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run test --filter=@comvive/shared --force
